name: Fuckball WebSocket fail-closed QA
on:
  pull_request:
    paths:
      - 'tests/ws-protocol-failclosed.cjs'
      - 'tests/ws-control-frame-qa.cjs'
      - 'tests/ws-utf8-close-qa.cjs'
      - 'tests/ws-utf8-network-qa.cjs'
      - 'tests/ws-length-encoding-qa.cjs'
      - 'tests/ws-upgrade-protocol-qa.cjs'
      - 'headless/websocket.cjs'
      - '.github/workflows/ws-protocol-failclosed.yml'
      - 'headless/**'
      - 'dist/room-core.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact clean source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate WebSocket protocol without VPS access
        run: node tests/ws-protocol-failclosed.cjs && node tests/ws-control-frame-qa.cjs && node tests/ws-upgrade-protocol-qa.cjs && node tests/ws-utf8-close-qa.cjs && node tests/ws-utf8-network-qa.cjs && node tests/ws-length-encoding-qa.cjs
