name: Fuckball WebSocket fail-closed QA
on:
  pull_request:
    paths:
      - 'tests/ws-protocol-failclosed.cjs'
      - '.github/workflows/ws-protocol-failclosed.yml'
      - 'headless/**'
      - 'dist/room-core.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate WebSocket protocol without VPS access
        run: node tests/ws-protocol-failclosed.cjs
