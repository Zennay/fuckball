name: QA Live Room Rate Limiting
on:
  pull_request:
    paths:
      - 'tests/room-message-rate-qa.cjs'
      - 'headless/server.cjs'
      - 'headless/websocket.cjs'
      - '.github/workflows/qa-room-rate-limit.yml'
  push:
    branches: [main]
    paths:
      - 'tests/room-message-rate-qa.cjs'
      - 'headless/server.cjs'
      - 'headless/websocket.cjs'
      - '.github/workflows/qa-room-rate-limit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-room-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:solo
      - run: node tests/room-message-rate-qa.cjs
