name: QA Mixed Native Netcode v2 v3
on:
  pull_request:
    paths:
      - 'tests/room-mixed-netcode-qa.cjs'
      - 'dist/room-core.js'
      - 'dist/netcode.js'
      - 'headless/server.cjs'
      - '.github/workflows/qa-mixed-netcode.yml'
  push:
    branches: [main]
    paths:
      - 'tests/room-mixed-netcode-qa.cjs'
      - 'dist/room-core.js'
      - 'dist/netcode.js'
      - 'headless/server.cjs'
      - '.github/workflows/qa-mixed-netcode.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mixed-netcode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:solo
      - run: node tests/room-mixed-netcode-qa.cjs
