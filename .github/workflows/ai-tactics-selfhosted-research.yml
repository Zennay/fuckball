name: Fuckball Tactical Research (self-hosted)
on:
  push:
    branches:
      - feat/ai-football-intelligence-20261020
    paths:
      - .github/workflows/ai-tactics-selfhosted-research.yml
permissions:
  contents: read
concurrency:
  group: fuckball-ai-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tactical-research:
    runs-on: [self-hosted, haxlab]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          clean: true
      - name: Read-only exact commit and source inspection
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          node --check dist/ai/policy.js
          node --check dist/ai/selfplay.js
          node --check training/ball-telemetry.cjs
      - name: Research-only native scenario and tactical comparison
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          export NICE_LEVEL=19
          LIVE_POLICY=/opt/fuckball-releases/84f819633fad77ccdbeac1f5fe6b69374ce421d7-39214993688/dist/ai/policy.js
          if test ! -r "$LIVE_POLICY"; then
            echo "No authorized pinned live policy on this runner; comparison skipped"
            exit 0
          fi
          echo '### OLD LIVE POLICY VS NEW TACTICS (mirrored, private, no model promotion)'
          nice -n 19 timeout 120s node --max-old-space-size=192 training/duel.cjs "$LIVE_POLICY" "$GITHUB_WORKSPACE/dist/ai/policy.js" 8 900 1
          echo '### NEW TRAINING SCENE TELEMETRY (native 4v4, safe, no live rooms)'
          nice -n 19 timeout 120s node --max-old-space-size=192 - <<'NODE'
          const AI=require('./dist/ai/policy.js');
          const SP=require('./dist/ai/selfplay.js');
          const {makeRoom}=require('./training/selfplay.cjs');
          for(const scene of [4,5,6,7,8]){
            const match=SP.match(makeRoom,AI.defaultProfile,AI.defaultProfile,1,
              20261020+scene,'BFF',900,null,null,12,scene);
            console.log(JSON.stringify({scene,score:[match.goals,match.conceded],
              attemptedPasses:match.events?.passAttempts,
              completedPasses:match.events?.passCompleted,
              interceptedPasses:match.events?.passIntercepted,
              shotAttempts:match.events?.shotAttempts,
              projectedOnTarget:match.events?.shotProjectedOnTarget,
              keeperDistributionsCompleted:match.events?.keeperDistributionsCompleted,
              keeperTurnovers:match.events?.keeperTurnovers}));
          }
          NODE
