name: Fuckball browser smoke
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'shared/**'
      - 'test/browser-smoke.js'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser interaction smoke test
        run: node test/browser-smoke.js
      - name: Upload UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuckball-immersive-browser
          path: fuckball-immersive-smoke.png
          if-no-files-found: ignore
