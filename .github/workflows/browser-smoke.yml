name: Fuckball application and Canvas integration
on:
  push:
    branches: [main]
    paths: ['dist/**', 'headless/**', 'tests/**', '.github/workflows/browser-smoke.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-contracts:
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact clean source before build and tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.100
      - run: npm run test:ui
      # Renderer regression: the native AE cache cannot be published as a
      # stable frame, and guest input/ACK replay must remain distinguishable.
      - run: node tests/prediction-snapshot-independence.cjs
      - run: node tests/input-replay-acceptance.cjs
  peer-hosting-chromium:
    # Real Chromium: WebRTC data channels between two pages, the room hosted in a page's Web Worker,
    # handovers server <-> page and failover when the hosting page closes (docs/netcode-plan.md).
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact clean source before build and tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
