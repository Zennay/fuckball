name: Fuckball application and Canvas integration
on:
  push:
    branches: [main]
    paths: ['dist/**', 'headless/**', 'tests/**', '.github/workflows/browser-smoke.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.100
      - run: npm run test:ui
  peer-hosting-chromium:
    # Real Chromium: WebRTC data channels between two pages, the room hosted in a page's Web Worker,
    # handovers server <-> page and failover when the hosting page closes (docs/netcode-plan.md).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
