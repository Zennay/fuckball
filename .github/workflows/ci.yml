name: Test Fuckball
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact clean source before build and tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:solo
      - run: npm test
      - name: Guard HaxLab trainer package resolution
        run: python3 tests/haxlab-package-resolution.py
      - run: node --check server.js
